services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vivolog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      VIVOLOG_DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/vivolog
      VIVOLOG_DATABASE_URL_SYNC: postgresql://postgres:postgres@db:5432/vivolog

volumes:
  pgdata:
